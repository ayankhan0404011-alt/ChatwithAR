<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ChatAR</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div class="chat-shell" id="chatShell">
  <div class="sidebar">
    <div class="sidebar-header">
      <div class="whoami" id="whoami">…</div>
      <button class="icon-btn" id="logoutBtn">Logout</button>
    </div>
    <div style="padding:6px 16px;font-size:10.5px;color:#8696a0;background:#f0f2f5;border-bottom:1px solid #e9edef;">Chat<span style="color:#25d366;font-weight:700;">AR</span> — Created by AR</div>
    <div class="new-chat-row">
      <input type="text" id="newChatUsername" placeholder="username se chat shuru karein" />
      <button id="newChatBtn">Chat</button>
    </div>
    <div class="contact-list" id="contactList">
      <div class="empty-contacts">Abhi koi chat nahi hai. Upar username daal kar shuru karein.</div>
    </div>
  </div>

  <div class="conversation" id="conversationPane">
    <div class="no-conv">Ek chat chunein ya naya username daal kar<br/>baat shuru karein.</div>
  </div>
</div>

<script type="module" src="js/chat.js"></script>
</body>
</html>
