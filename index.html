<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ChatWithAR — Sign in</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div class="auth-shell">
  <div class="auth-card">
    <div class="auth-mark">Chat<span class="brand-ar">AR</span></div>
    <div class="auth-created-by">Created by AR</div>
    <h1 class="auth-title" id="formTitle">Welcome back</h1>
    <p class="auth-sub" id="formSub">Sign in with just a username and password — no mobile number required.</p>

    <div class="auth-error" id="errorBox"></div>

    <form id="authForm">
      <div class="field">
        <label for="username">Username</label>
        <input type="text" id="username" autocomplete="username" placeholder="e.g. rahul_92" required minlength="3" pattern="[a-zA-Z0-9_]+" />
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" autocomplete="current-password" placeholder="••••••••" required minlength="6" />
      </div>
      <button type="submit" class="btn-primary" id="submitBtn">Sign in</button>
    </form>

    <div class="auth-switch">
      <span id="switchText">Naya account banana hai?</span>
      <button type="button" id="switchBtn">Sign up</button>
    </div>

    <div class="auth-note">
      Your chat stays just between you and the person you're talking to – no third participant can see it.
    </div>
  </div>
</div>

<script type="module" src="js/auth.js"></script>
</body>
</html>
